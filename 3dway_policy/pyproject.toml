[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "3dway-policy"
version = "0.1.0"
description = "Turn paired-view NVILA trajectories into robot actions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "openai==1.8.0",
    "httpx==0.24.0",
    "anyio==4.12.1",
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
visualization = ["open3d>=0.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
